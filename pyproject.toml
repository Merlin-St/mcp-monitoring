[project]
name = "mcp-monitoring"
version = "0.1.0"
description = "MCP Server Monitoring Dashboard - comprehensive analysis of Model Context Protocol servers across multiple data sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core HTTP libraries
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    
    # Data analysis and visualization
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "plotly>=5.17.0",
    "matplotlib>=3.7.0",
    
    # Web scraping
    "selenium>=4.15.0",
    
    # Natural language processing and embeddings
    "nltk>=3.8.0",
    "sentence-transformers>=2.2.0",
    "umap-learn>=0.5.7",
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "hdbscan>=0.8.33",
    "gensim>=4.3.2",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "bertopic",
    "xformers",
    
    # Web dashboard
    "streamlit>=1.28.0",
    
    # Additional dependencies
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    
    # LLM evaluation framework
    "inspect-ai>=0.3.0",
    "anthropic>=0.8.0",
    "python-dotenv>=1.0.0",
    "mcp",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=7.4.0",
    
    # Code quality
    "ruff>=0.12.3",
]

[tool.ruff]
# Increased for existing codebase
line-length = 200

# Assume Python 3.10+
target-version = "py310"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pycaches__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E501"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10