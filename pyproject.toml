[project]
name = "mcp-monitoring"
version = "0.1.0"
description = "MCP Server Monitoring Dashboard - comprehensive analysis of Model Context Protocol servers across multiple data sources"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # AISI and Inspect packages
    "aisitools>=0.4.0",
    "inspect-ai>=0.3.119",
    "inspect-k8s-sandbox",
    "inspect_evals@git+https://github.com/UKGovernmentBEIS/inspect_evals",
    # LLM API clients
    "anthropic>=0.8.0",
    "openai",
    "mistralai",
    "groq",
    # Core HTTP libraries
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    # Data analysis and visualization
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.9.0",
    "plotly>=5.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    # Jupyter and notebook support
    "jupyter",
    "ipywidgets",
    "jupyterlab",
    "notebook",
    "ipykernel",
    # Hugging Face ecosystem
    "transformers",
    "datasets",
    "huggingface_hub",
    "sentence-transformers>=2.2.0",
    # Natural language processing and embeddings
    "nltk>=3.8.0",
    "umap-learn>=0.5.7",
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "hdbscan>=0.8.33",
    "gensim>=4.3.2",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "bertopic",
    "xformers",
    "wordcloud",
    # Web dashboard and visualization
    "streamlit>=1.28.0",
    # Web scraping
    "selenium>=4.15.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # Essential utilities
    "python-dotenv>=1.0.1",
    "openpyxl",
    "mcp",
    "db-dtypes>=1.0.0",
    "google-cloud-bigquery", #for npm and pypi download stats
    "pypistats>=1.7.0", #for pypi download stats API
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.1",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0",
    "pyright>=1.1.382",
    "pytest>=8.0.0",
    "ruff>=0.12.3",
]

build = [
    "hatchling",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.0.0",
    
    # Code quality
    "ruff>=0.12.3",
    "pre-commit>=3.8.0",
    "pyright>=1.1.382",
]

[tool.uv.sources]
inspect-k8s-sandbox = {git = "https://github.com/UKGovernmentBEIS/inspect_k8s_sandbox.git"}
aisitools = { git = "ssh://git@github.com/AI-Safety-Institute/aisi-inspect-tools.git" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88

# Assume Python 3.10+
target-version = "py310"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pycaches__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E501"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pyright]
include = ["."]
reportUnusedImport = true
